<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship Game</title>

  <!-- Favicon code -->
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
  <link rel="manifest" href="/images/favicon/site.webmanifest">

  <link rel="stylesheet" href="battleship_styles.css">
  <script src="battleship_script.js" defer></script>
</head>

<body>
    <main>
    <h1>Battleship</h1>
    <section id="gameRuleContainer" aria-labelledby="rulesHeading">
      <h2 id="rulesHeading">Game Rules</h2>
      <ol>
        <li>Click on the cells to reveal the image hidden behind them.</li>
        <li>There are 5 ships hidden in the game.</li>
        <li>You win if you can find all ships in less than 8 clicks, else you lose.</li>
      </ol>
    </section>
    <div id="gridContainer" role="grid" aria-label="Battleship board"></div>
    <div id="gameStatus" role="status" aria-live="polite" class="visually-hidden"></div>
    <button type="button" id="resetButton">Reset</button>
    </main>
</body>
</html>
